version: '3.8'

services:
  postgres_bi:
    image: postgres:15-alpine
    container_name: retention_db
    environment:
      POSTGRES_USER: bi_admin
      POSTGRES_PASSWORD: bi_password
      POSTGRES_DB: retention_warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_bi
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=retention_warehouse
      - MB_DB_PORT=5432
      - MB_DB_USER=bi_admin
      - MB_DB_PASS=bi_password
      - MB_DB_HOST=postgres_bi
    depends_on:
      - postgres_bi

  retention_api:
    build: .
    container_name: retention_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres_bi
    depends_on:
      - postgres_bi

  crm_frontend:
    image: python:3.11-slim
    container_name: crm_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    command: bash -c "pip install streamlit requests && streamlit run frontend/app.py --server.address 0.0.0.0"
    depends_on:
      - retention_api
